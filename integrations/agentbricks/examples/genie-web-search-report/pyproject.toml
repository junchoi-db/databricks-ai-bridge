[project]
name = "agent-openai"
version = "0.1.0"
description = "OpenAI Agents SDK agent on the Agent Bricks durable runtime for Databricks Apps"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Agent Bricks includes the HTTP runtime; this extra adds the openai framework adapter.
    "databricks-agentbricks[openai]>=0.2.0",
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
    "databricks-agents>=1.9.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
databricks-agentbricks = { git = "https://github.com/databricks/databricks-ai-bridge.git", rev = "81c427266af394216f327fb5c0159db332f1ae64", subdirectory = "integrations/agentbricks" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
